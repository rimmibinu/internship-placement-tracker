server.port=8080
spring.application.name=placement-tracker

# Database: H2 file DB by default (zero setup). Override with env vars for MySQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/placementdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Eligibility microservice (CO-5)
eligibility.url=${ELIGIBILITY_URL:http://localhost:8081}
eligibility.fallback-enabled=${ELIGIBILITY_FALLBACK:true}

# App settings
app.admin-email=${ADMIN_EMAIL:tpo@campus.demo}
app.seed=${APP_SEED:true}
app.demo-mode=${DEMO_MODE:true}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
